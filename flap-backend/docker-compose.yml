services:
  postgres:
    image: postgres:15
    container_name: flap-postgres
    environment:
      POSTGRES_DB: flap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: flap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: flap-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flap
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: flap-secret-key-flap-secret-key-flap-secret-key
      JWT_ACCESS_TOKEN_EXPIRATION: 1800000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: